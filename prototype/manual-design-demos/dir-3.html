<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潓美医疗 · 手动操作 C</title>
<style>
:root{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#172e3c;background:#e7edf0}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #e99b28;outline-offset:2px}button:disabled{opacity:.4;cursor:not-allowed}.page{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;padding:18px 22px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:900;color:#153c54}.head span{font-size:18px;color:#4b6470}.summary{display:flex;align-items:center;justify-content:space-between;background:#143d54;color:white;border-radius:15px;padding:14px 24px;min-height:94px}.summary strong{font-size:33px}.summary small{font-size:20px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}.panel{background:#fff;border:2px solid #c7d5db;border-radius:18px;padding:19px}.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel h1{font-size:30px;margin:0}.panel em{font-size:20px;font-style:normal;font-weight:750;color:#3e6877}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buttons button{min-height:94px;border-radius:15px;border:2px solid #99b7c2;background:#f1f7f9;color:#1b5268;font-size:25px;font-weight:850}.buttons button.primary{background:#075985;color:white;border-color:#075985}.buttons button.stop{background:#fff4ee;border-color:#d79a82;color:#963e2b}.buttons button:active,.sleep:active{filter:brightness(.88)}.note{font-size:19px;line-height:1.4;margin:17px 0 0;color:#465d67}.bottom{display:flex;gap:12px;align-items:center}.feedback{flex:1;font-size:20px;font-weight:750;padding:14px 18px;background:#d4e3e8;border-radius:12px;min-height:66px}.sleep{min-width:210px;min-height:66px;border-radius:12px;border:2px solid #927b54;background:#faf5ea;font-size:22px;font-weight:800;color:#5d4d34}.dialog{position:fixed;inset:0;background:#132b3999;display:none;align-items:center;justify-content:center;padding:16px}.dialog.show{display:flex}.box{background:white;border-radius:18px;padding:28px;width:min(550px,100%)}.box h2{font-size:32px;margin:0}.box p{font-size:23px}.box div{display:flex;gap:12px}.box button{flex:1;min-height:75px;border-radius:12px;border:2px solid #99b7c2;background:white;font-size:23px;font-weight:800}.box button:last-child{background:#a3382b;color:white;border-color:#a3382b}@media(max-width:760px){.page{padding:12px}.panels{grid-template-columns:1fr}.summary{flex-wrap:wrap}.buttons button{min-height:85px;font-size:22px}.bottom{flex-wrap:wrap}.sleep{width:100%}}
@media(min-width:761px) and (max-height:600px){.page{padding:12px 18px;gap:8px}.summary{min-height:72px;padding:9px 18px}.summary strong{font-size:30px}.panel{padding:12px}.panel header{margin-bottom:8px}.panel h1{font-size:28px}.buttons{gap:9px}.buttons button{min-height:76px}.note{margin-top:8px;font-size:18px}.feedback,.sleep{min-height:60px}}
</style></head><body>
<div class="page"><header class="head"><div class="brand">潓美医疗 · 手动控制</div><span>所有操作均为演示模拟</span></header>
<div class="summary" aria-live="polite"><strong id="status">设备待机中</strong><small id="summary-detail">产气未开始 · 雾化未开始</small></div>
<main class="panels"><section class="panel"><header><h1>产气</h1><em id="gas-state">未开始</em></header><div class="buttons"><button class="primary" data-act="start">开始产气</button><button class="stop" data-act="stop">停止产气</button><button data-act="pause">暂停产气</button><button data-act="resume">恢复产气</button></div><p class="note">停止产气需要再次确认；暂停后可以恢复。</p></section>
<section class="panel"><header><h1>雾化</h1><em id="neb-state">未开始</em></header><div class="buttons"><button class="primary" data-act="neb-on">开始雾化</button><button class="stop" data-act="neb-off">停止雾化</button></div><p class="note">先开始产气，才可以开启雾化。停止产气时，雾化也会停止。</p></section></main>
<footer class="bottom"><div class="feedback" id="feedback">请按功能分区点击按钮。</div><button class="sleep" data-act="sleep">进入睡眠模式</button></footer></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="box"><h2 id="dialog-title">请确认操作</h2><p id="dialog-text"></p><div><button id="cancel">取消</button><button id="confirm">确认执行</button></div></div></div>
<script>
const s={gas:false,neb:false,paused:false,sleep:false},$=id=>document.getElementById(id);let pending=null;const labels={start:'开始产气',stop:'停止产气','neb-on':'开始雾化','neb-off':'停止雾化',pause:'暂停产气',resume:'恢复产气',sleep:'睡眠模式'};function render(msg){$('status').textContent=s.sleep?'设备睡眠中':s.paused?'产气已暂停':s.gas?'设备产气中':'设备待机中';$('summary-detail').textContent=`产气${s.gas?s.paused?'已暂停':'进行中':'未开始'} · 雾化${s.neb?'进行中':'未开始'}`;$('gas-state').textContent=s.gas?s.paused?'已暂停':'进行中':'未开始';$('neb-state').textContent=s.neb?'进行中':'未开始';$('feedback').textContent=msg||'请按功能分区点击按钮。';for(let [a,disabled] of Object.entries({start:s.gas&&!s.sleep,stop:!s.gas,pause:!s.gas||s.paused,resume:!s.paused,'neb-on':!s.gas||s.paused||s.neb,'neb-off':!s.neb})){document.querySelector(`[data-act="${a}"]`).disabled=disabled}}
function act(a){if(a==='stop'||a==='sleep'){pending=a;$('dialog-title').textContent=a==='stop'?'确认停止产气？':'确认进入睡眠模式？';$('dialog-text').textContent=a==='stop'?'停止后，雾化也会停止。':'进入睡眠前，请确认当前设备状态。';$('dialog').classList.add('show');$('cancel').focus();return}execute(a)}function execute(a){if(a==='start'){s.gas=true;s.paused=false;s.sleep=false}else if(a==='stop'){s.gas=false;s.neb=false;s.paused=false}else if(a==='neb-on')s.neb=true;else if(a==='neb-off')s.neb=false;else if(a==='pause')s.paused=true;else if(a==='resume')s.paused=false;else if(a==='sleep'){s.sleep=true;s.gas=false;s.neb=false;s.paused=false}render('已执行：'+labels[a])}document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));$('cancel').onclick=()=>{$('dialog').classList.remove('show');pending=null};$('confirm').onclick=()=>{let a=pending;pending=null;$('dialog').classList.remove('show');if(a)execute(a)};render();
</script></body></html>
