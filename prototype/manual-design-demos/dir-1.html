<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>潓美医疗 · 手动操作 A</title>
<style>
:root{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#123044;background:#edf6f8}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #ef9c28;outline-offset:3px}button:disabled{opacity:.42;cursor:not-allowed}.page{min-height:100vh;padding:24px 30px;display:grid;grid-template-rows:auto 1fr auto;gap:18px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:27px;font-weight:800;color:#075985}.top small,.meta{font-size:18px;color:#496877}.surface{display:grid;grid-template-columns:38% 1fr;gap:20px;min-height:0}.status,.controls{background:white;border-radius:20px;padding:24px;border:1px solid #d2e4e9}.status{display:flex;flex-direction:column}.eyebrow{font-size:20px;color:#3f6170;font-weight:700}.state{font-size:54px;line-height:1.1;font-weight:900;color:#075985;margin:16px 0}.state.working{color:#08785d}.state.fault{color:#b93232}.detail{font-size:24px;line-height:1.45}.meter{margin-top:auto;background:#e5f2f5;border-radius:12px;padding:16px 18px;font-size:21px;font-weight:700}.controls h1{font-size:30px;margin:0 0 14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions button{border:2px solid #a8cdd9;border-radius:16px;background:#f7fcfd;color:#123b50;min-height:90px;font-size:25px;font-weight:800}.actions button.primary{background:#075985;border-color:#075985;color:white}.actions button.danger{background:#fff6f4;border-color:#deafa7;color:#982e24}.actions button:active{filter:brightness(.9)}.small-actions{display:flex;gap:12px;margin-top:12px}.small-actions button{min-height:68px;flex:1;border:1px solid #abcbd5;border-radius:12px;background:white;font-size:20px;font-weight:700;color:#27556b}.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#dceff1;border-radius:14px;padding:12px 20px;font-size:20px;font-weight:700}.foot b{color:#075985}.dialog{position:fixed;inset:0;background:#102b3b99;display:none;align-items:center;justify-content:center;padding:20px}.dialog.show{display:flex}.box{background:white;border-radius:18px;padding:28px;width:min(550px,100%)}.box h2{font-size:32px;margin:0 0 12px}.box p{font-size:23px}.box div{display:flex;gap:12px;margin-top:22px}.box button{flex:1;min-height:76px;border-radius:12px;border:2px solid #8eb9c8;background:white;font-weight:800;font-size:23px}.box button:last-child{background:#a93429;border-color:#a93429;color:white}@media(max-width:760px){.page{padding:14px}.surface{grid-template-columns:1fr}.state{font-size:44px}.status{min-height:210px}.actions button{min-height:82px;font-size:22px}.foot{font-size:17px;flex-wrap:wrap}}
@media(min-width:761px) and (max-height:600px){.page{padding:16px 24px;gap:10px}.status,.controls{padding:18px}.controls h1{margin-bottom:10px}.actions{gap:10px}.actions button{min-height:78px}.small-actions{margin-top:10px}.small-actions button{min-height:60px}.foot{padding:10px 16px}.state{font-size:49px}}
</style>
</head>
<body>
<div class="page"><header class="top"><div class="brand">潓美医疗</div><small>手动操作演示 · 不连接真实设备</small></header>
<main class="surface"><section class="status" aria-live="polite"><div class="eyebrow">设备当前状态</div><div class="state" id="state">待机中</div><div class="detail" id="detail">设备已准备好，可以开始产气。</div><div class="meter" id="meter">产气：未开始　　雾化：未开始</div></section>
<section class="controls"><h1>您想做什么？</h1><div class="actions"><button class="primary" data-act="start">开始产气</button><button class="danger" data-act="stop">停止产气</button><button data-act="neb-on">开始雾化</button><button data-act="neb-off">停止雾化</button></div><div class="small-actions"><button data-act="pause">暂停产气</button><button data-act="resume">恢复产气</button><button data-act="sleep">睡眠模式</button></div></section></main>
<footer class="foot"><span id="feedback">请点击按钮操作，系统会在这里告诉您结果。</span><b>如有故障，请停止操作并联系工作人员</b></footer></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="box"><h2 id="dialog-title">请确认操作</h2><p id="dialog-text"></p><div><button id="cancel">取消</button><button id="confirm">确认执行</button></div></div></div>
<script>
const s={gas:false,neb:false,paused:false,sleep:false};const $=id=>document.getElementById(id);let pending=null;function render(msg){let name=s.sleep?'睡眠中':s.paused?'产气已暂停':s.gas?'产气中':'待机中';$('state').textContent=name;$('state').className='state '+(s.gas&&!s.paused?'working':'');$('detail').textContent=s.sleep?'点击“开始产气”可继续操作。':s.paused?'产气已暂停，您可以恢复或停止。':s.gas?'设备正在为您产气。':'设备已准备好，可以开始产气。';$('meter').textContent=`产气：${s.gas?s.paused?'已暂停':'进行中':'未开始'}　　雾化：${s.neb?'进行中':'未开始'}`;$('feedback').textContent=msg||'请点击按钮操作，系统会在这里告诉您结果。';document.querySelector('[data-act="start"]').disabled=s.gas&&!s.sleep;document.querySelector('[data-act="stop"]').disabled=!s.gas;document.querySelector('[data-act="neb-on"]').disabled=!s.gas||s.paused||s.neb;document.querySelector('[data-act="neb-off"]').disabled=!s.neb;document.querySelector('[data-act="pause"]').disabled=!s.gas||s.paused;document.querySelector('[data-act="resume"]').disabled=!s.paused}
function act(a){if(a==='stop'||a==='sleep'){pending=a;$('dialog-title').textContent=a==='stop'?'确认停止产气？':'确认进入睡眠模式？';$('dialog-text').textContent=a==='stop'?'停止后，雾化也会停止。':'进入睡眠后，屏幕将不再显示运行界面。';$('dialog').classList.add('show');$('cancel').focus();return}execute(a)}function execute(a){if(a==='start'){s.gas=true;s.paused=false;s.sleep=false}else if(a==='stop'){s.gas=false;s.neb=false;s.paused=false}else if(a==='neb-on')s.neb=true;else if(a==='neb-off')s.neb=false;else if(a==='pause')s.paused=true;else if(a==='resume')s.paused=false;else if(a==='sleep'){s.sleep=true;s.gas=false;s.neb=false;s.paused=false}render(({start:'已开始产气',stop:'已停止产气', 'neb-on':'已开始雾化','neb-off':'已停止雾化',pause:'已暂停产气',resume:'已恢复产气',sleep:'已进入睡眠模式'})[a])}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));$('cancel').onclick=()=>{$('dialog').classList.remove('show');pending=null};$('confirm').onclick=()=>{const a=pending;$('dialog').classList.remove('show');pending=null;if(a)execute(a)};render();
</script>
</body></html>
