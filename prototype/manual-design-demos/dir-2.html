<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潓美医疗 · 手动操作 B</title>
<style>
:root{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#193d43;background:#f4f6f1}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #e6a138;outline-offset:3px}button:disabled{opacity:.42;cursor:not-allowed}.page{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;padding:20px 28px;gap:14px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:850;color:#145e69}.caption{font-size:18px;color:#566c6b}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tabs button{height:72px;border:2px solid #b8cecb;border-radius:12px;background:#fff;font-size:24px;font-weight:800;color:#2c5c62}.tabs button[aria-selected="true"]{background:#145e69;color:white;border-color:#145e69}.main{background:#fff;border:1px solid #d6e2dd;border-radius:20px;padding:26px 36px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:340px}.status{font-size:20px;font-weight:700;color:#52706e}.main h1{font-size:45px;line-height:1.15;margin:10px 0;color:#163f48}.main p{font-size:23px;line-height:1.4;margin:0 0 22px;max-width:740px}.action-row{display:flex;gap:12px;width:min(690px,100%)}.action-row button{flex:1;min-height:90px;border:2px solid #145e69;border-radius:15px;background:#145e69;color:white;font-size:27px;font-weight:850}.action-row button.sub{background:white;color:#145e69}.action-row button.warn{background:#a0352d;border-color:#a0352d}.foot{font-size:19px;font-weight:700;color:#375c60;display:flex;justify-content:space-between;gap:12px}.dialog{position:fixed;inset:0;background:#17333299;display:none;align-items:center;justify-content:center;padding:16px}.dialog.show{display:flex}.box{width:min(560px,100%);background:white;border-radius:18px;padding:28px;text-align:center}.box h2{font-size:32px;margin:0}.box p{font-size:23px}.box div{display:flex;gap:12px}.box button{flex:1;min-height:78px;background:white;border:2px solid #9fbdbb;border-radius:12px;font-size:23px;font-weight:800}.box button:last-child{background:#a0352d;border-color:#a0352d;color:white}@media(max-width:760px){.page{padding:14px}.head{flex-wrap:wrap}.tabs button{font-size:21px}.main{padding:24px 16px;min-height:390px}.main h1{font-size:39px}.action-row{flex-direction:column}.foot{font-size:16px;flex-wrap:wrap}}
@media(min-width:761px) and (max-height:600px){.page{padding:14px 24px;gap:10px}.main{min-height:300px;padding:18px 28px}.main h1{font-size:42px}.main p{margin-bottom:14px}.tabs button{height:68px}.action-row button{min-height:82px}}
</style></head><body>
<div class="page"><header class="head"><div class="brand">潓美医疗</div><div class="caption">一步一屏 · 手动操作演示</div></header>
<nav class="tabs" aria-label="功能选择"><button data-tab="gas" aria-selected="true">产气</button><button data-tab="neb" aria-selected="false">雾化</button><button data-tab="rest" aria-selected="false">暂停与休息</button></nav>
<main class="main" aria-live="polite"><div class="status" id="status">设备状态：待机中</div><h1 id="title">开始产气</h1><p id="hint">点击下方按钮，设备开始产气。当前为演示界面，不连接真实机器。</p><div class="action-row" id="actions"></div></main>
<footer class="foot"><span id="feedback">请选择功能，再点击大按钮。</span><span>故障时请联系工作人员</span></footer></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="box"><h2 id="dialog-title">请确认</h2><p id="dialog-text"></p><div><button id="cancel">不执行</button><button id="confirm">确认执行</button></div></div></div>
<script>
const s={tab:'gas',gas:false,neb:false,paused:false,sleep:false};const $=id=>document.getElementById(id);let pending=null;const labels={start:'开始产气',stop:'停止产气',nebOn:'开始雾化',nebOff:'停止雾化',pause:'暂停产气',resume:'恢复产气',sleep:'睡眠模式'};function button(a,kind=''){return `<button data-act="${a}" class="${kind}">${labels[a]}</button>`}function render(msg){const status=s.sleep?'睡眠中':s.paused?'产气已暂停':s.gas?'产气中':'待机中';$('status').textContent='设备状态：'+status;$('feedback').textContent=msg||'请选择功能，再点击大按钮。';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===s.tab));if(s.tab==='gas'){if(s.gas){$('title').textContent='正在产气';$('hint').textContent='如需结束，请点击停止；停止前会再次确认。';$('actions').innerHTML=button('stop','warn')}else{$('title').textContent='开始产气';$('hint').textContent='点击下方按钮，设备开始产气。当前为演示界面，不连接真实机器。';$('actions').innerHTML=button('start')}}if(s.tab==='neb'){if(!s.gas||s.paused){$('title').textContent='请先开始产气';$('hint').textContent='产气运行时才能使用雾化。';$('actions').innerHTML=button('start')}else{$('title').textContent=s.neb?'雾化进行中':'开始雾化';$('hint').textContent=s.neb?'点击停止雾化，不影响产气。':'点击开始雾化。';$('actions').innerHTML=button(s.neb?'nebOff':'nebOn')}}if(s.tab==='rest'){$('title').textContent=s.paused?'产气已暂停':'暂停或休息';$('hint').textContent='暂停后可以恢复；进入睡眠需要再次确认。';$('actions').innerHTML=(s.gas?button(s.paused?'resume':'pause','sub'):'')+button('sleep','sub')}document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act))}
function act(a){if(a==='stop'||a==='sleep'){pending=a;$('dialog-title').textContent=a==='stop'?'确认停止产气？':'确认进入睡眠？';$('dialog-text').textContent=a==='stop'?'停止产气后，雾化也会停止。':'进入睡眠前，请确认设备使用状态。';$('dialog').classList.add('show');$('cancel').focus();return}execute(a)}function execute(a){if(a==='start'){s.gas=true;s.paused=false;s.sleep=false}else if(a==='stop'){s.gas=false;s.neb=false;s.paused=false}else if(a==='nebOn')s.neb=true;else if(a==='nebOff')s.neb=false;else if(a==='pause')s.paused=true;else if(a==='resume')s.paused=false;else if(a==='sleep'){s.sleep=true;s.gas=false;s.neb=false;s.paused=false}render('已执行：'+labels[a])}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{s.tab=b.dataset.tab;render()});$('cancel').onclick=()=>{$('dialog').classList.remove('show');pending=null};$('confirm').onclick=()=>{let a=pending;pending=null;$('dialog').classList.remove('show');if(a)execute(a)};render();
</script></body></html>
