<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf6f8">
  <title>潓美医疗 AI 虚拟人｜交互原型</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="compat.css">
</head>
<body>
  <!--
    交互原型假设：
    1. 目标屏幕物理 1920×1200，应用可用区约 1920×1080；Android density 320，按 960×540 CSS 像素设计。
    2. 患者侧只呈现必要状态、短句和一个主操作，演示控制台用于评审人员注入模拟事件。
    3. 人物来自项目 V5 Lottie 素材；这里用同一组原始 PNG 图层构成静态/简易口型示意。
    4. 所有 MCU 状态、故障码、应答、身份结果和语音均为前端模拟；协议 TBD 字段绝不冒充正式值。
    5. “潓美医疗”以文本显示，项目内没有经核实的官方 Logo。
  -->
  <div class="app-shell" id="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="潓美医疗"><span>潓美医疗</span></div>
      <div class="topbar-center"><span class="topbar-dash"></span><span id="top-status">待机中</span></div>
      <div class="topbar-right"><span class="prototype-label">交互原型 · 模拟数据</span><button class="console-toggle" id="console-toggle" type="button" aria-expanded="false" aria-controls="console-panel">演示控制台 <span aria-hidden="true">⌘</span></button></div>
    </header>

    <main class="main-stage" id="main-stage">
      <section class="avatar-zone" aria-label="医疗助手形象">
        <div class="avatar-halo halo-one"></div><div class="avatar-halo halo-two"></div>
        <div class="avatar-frame" id="avatar-frame">
          <img class="avatar-base" src="assets/assistant_mouthless.png" alt="医疗助手虚拟人">
          <img class="avatar-eyes" id="avatar-eyes" src="assets/eyes-half.png" alt="" style="display:none">
          <img class="avatar-mouth" id="avatar-mouth" src="assets/mouth_closed.png" alt="">
        </div>
        <div class="avatar-state" id="avatar-state"><span class="avatar-state-dot"></span>安静待命</div>
      </section>

      <section class="conversation-zone" aria-live="polite">
        <div class="overline" id="view-eyebrow">随时为您服务</div>
        <h1 id="view-title">您好，我在这里</h1>
        <p class="lead" id="view-lead">说出“潓美医疗”，即可开始对话。</p>
        <div class="view-detail" id="view-detail"></div>
        <div class="view-actions" id="view-actions"></div>
      </section>
    </main>

    <footer class="bottom-bar"><div class="privacy-note"><span class="privacy-dot"></span><span id="footer-primary">本地待机 · 不保存环境音频</span></div><div id="footer-secondary">语音唤醒或人脸驻留 3 秒</div></footer>
  </div>

  <div class="sleep-screen" id="sleep-screen" hidden><div class="sleep-mark"></div><p>设备已进入睡眠</p><span>说“潓美医疗”或让人脸驻留 3 秒可重新唤醒</span><button type="button" data-action="wake-voice">模拟唤醒</button></div>

  <aside class="console-panel" id="console-panel" aria-label="演示控制台" aria-hidden="true">
    <div class="console-head"><div><strong>演示控制台</strong><small>仅用于评审 · 所有事件为模拟</small></div><button type="button" id="console-close" aria-label="关闭控制台">×</button></div>
    <nav class="console-tabs" aria-label="演示功能"><button class="active" type="button" data-tab="scenes">场景</button><button type="button" data-tab="commands">七条命令</button><button type="button" data-tab="reports">被动播报</button><button type="button" data-tab="logs">事件日志</button></nav>
    <div class="console-body" id="console-body"></div>
    <div class="console-foot">MCU 串口、应答码、故障码、客服渠道：TBD / 模拟</div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-icon">!</div><h2 id="modal-title">请确认</h2><p id="modal-message"></p><div class="modal-actions"><button type="button" data-action="cancel-modal">暂不执行</button><button class="primary" type="button" data-action="confirm-modal">确认执行</button></div></section></div>
  <script src="app.js"></script>
</body>
</html>
